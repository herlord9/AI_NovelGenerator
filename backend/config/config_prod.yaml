# 生产环境域名与端口。
# 启动前设置 NOVEL_GENERATOR_PROFILE=prod 后生效。
# 不设该变量时默认端口也是 9001 / 9002，但仍只监听 127.0.0.1。
# public_host 取自 ssh_tunnel_mysql.ps1 中的 SSH 服务器地址。
bind_host: "0.0.0.0"
public_scheme: "http"
public_host: "117.72.100.59"
backend_port: 9001
frontend_port: 9002

# MongoDB（与 compose.mongodb.yaml 映射端口一致）
mongodb_url: "mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true"
mongo_database_name: "novel_generator"
mongodb_port: 27017
